<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración - Mercado Caivan</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <h1>
            Administración
        </h1>

        <p>
            Mercado Caivan
        </p>

    </header>


    <main>

        <h2>
            Publicaciones pendientes
        </h2>


        <div id="publicaciones-pendientes">

            <p>
                Cargando publicaciones...
            </p>

        </div>

    </main>


    <script type="module">

    // ==============================
    // FIREBASE
    // ==============================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
        getFirestore,
        collection,
        query,
        where,
        getDocs,
        updateDoc,
        deleteDoc,
        doc,
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
    // ==============================
    // CONFIGURACIÓN FIREBASE
    // ==============================

    const firebaseConfig = {

        apiKey: "AIzaSyA9nKwRTGJliMO0Fk3rXiPk6rEAbQATiwA",
        authDomain: "mercado-caivan.firebaseapp.com",
        projectId: "mercado-caivan",
        storageBucket: "mercado-caivan.firebasestorage.app",
        messagingSenderId: "193052002924",
        appId: "1:193052002924:web:228d68afbd8601dd7e2649",
        measurementId: "G-WVWSJ9MD6Q"

        };


    // ==============================
    // INICIALIZAR FIREBASE
    // ==============================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    // ==============================
    // UID DEL ADMINISTRADOR
    // ==============================

    const ADMIN_UID =
        "Wudpnc9RrWNKSXlmMxdoW6wj7gW2";

async function cargarPublicacionesPendientes() {

    // Buscamos el contenedor donde aparecerán
    // las publicaciones pendientes.
    const contenedor =
        document.getElementById(
            "publicaciones-pendientes"
        );


    // Buscamos en Firestore todas las publicaciones
    // que todavía no han sido autorizadas.
    const consulta =
        query(
            collection(
                db,
                "publicaciones"
            ),

            where(
                "autorizada",
                "==",
                false
            )
        );


    // Ejecutamos la consulta.
    const resultados =
        await getDocs(
            consulta
        );


    // Limpiamos el mensaje
    // "Cargando publicaciones..."
    contenedor.innerHTML =
        "";


    // Si no encontramos publicaciones,
    // mostramos un mensaje.
    if (
        resultados.empty
    ) {

        contenedor.innerHTML =
            "<p>No hay publicaciones pendientes.</p>";

        return;
    }


    // Recorremos cada documento encontrado.
    resultados.forEach(
        (documento) => {

            // Obtenemos los datos de la publicación.
            const publicacion =
                documento.data();


            // Creamos la tarjeta.
            const tarjeta =
                document.createElement(
                    "article"
                );


            tarjeta.classList.add(
                "card"
            );


            // ==============================
            // IMAGEN
            // ==============================

            const imagen =
                document.createElement(
                    "div"
                );


            imagen.classList.add(
                "card-image"
            );


            if (
                publicacion.imagen
            ) {

                const foto =
                    document.createElement(
                        "img"
                    );


                foto.src =
                    publicacion.imagen;


                foto.alt =
                    publicacion.titulo;


                imagen.appendChild(
                    foto
                );

            } else {

                imagen.textContent =
                    "Sin imagen";

            }


            // ==============================
            // CONTENIDO
            // ==============================

            const contenido =
                document.createElement(
                    "div"
                );


            contenido.classList.add(
                "card-content"
            );


            // Categoría
            const categoria =
                document.createElement(
                    "div"
                );


            categoria.classList.add(
                "card-category"
            );


            categoria.textContent =
                publicacion.categoria;


            // Título
            const titulo =
                document.createElement(
                    "div"
                );


            titulo.classList.add(
                "card-title"
            );


            titulo.textContent =
                publicacion.titulo;


            // Descripción
            const descripcion =
                document.createElement(
                    "div"
                );


            descripcion.classList.add(
                "card-description"
            );


            descripcion.textContent =
                publicacion.descripcion;


            // Pie de tarjeta
            const footer =
                document.createElement(
                    "div"
                );


            footer.classList.add(
                "card-footer"
            );


            // Precio
            const precio =
                document.createElement(
                    "div"
                );


            precio.classList.add(
                "price"
            );


            precio.textContent =
                publicacion.precio;


            // Propietario
            const propietario =
                document.createElement(
                    "div"
                );


            propietario.classList.add(
                "seller"
            );


            propietario.textContent =
                "Usuario: "
                + publicacion.propietario;


            // ==============================
            // CONSTRUIMOS LA TARJETA
            // ==============================

            footer.appendChild(
                precio
            );


            footer.appendChild(
                propietario
            );


            contenido.appendChild(
                categoria
            );


            contenido.appendChild(
                titulo
            );


            contenido.appendChild(
                descripcion
            );


            contenido.appendChild(
                footer
            );
            
            const acciones =
            document.createElement(
                "div"
            );

            acciones.classList.add(
                "admin-acciones"
            );


            const botonAutorizar =
                document.createElement(
                    "button"
                );

            botonAutorizar.textContent =
                "Autorizar";

            botonAutorizar.classList.add(
                "admin-autorizar"
            );


            const botonRechazar =
                document.createElement(
                    "button"
                );

            botonRechazar.textContent =
                "Rechazar";

            botonRechazar.classList.add(
                "admin-rechazar"
            );


            acciones.appendChild(
                botonAutorizar
            );

            acciones.appendChild(
                botonRechazar
            );


            contenido.appendChild(
                acciones
            );

            tarjeta.appendChild(
                imagen
            );


            tarjeta.appendChild(
                contenido
            );


            // Finalmente añadimos
            // la tarjeta al panel.
            contenedor.appendChild(
                tarjeta
            );

        }
    );

}
    // ==============================
    // COMPROBAR USUARIO
    // ==============================

    onAuthStateChanged(
        auth,  
        async (user) => {

            // No hay usuario conectado
            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }


            // Usuario conectado,
            // pero no es administrador
            if (
                user.uid !== ADMIN_UID
            ) {

                alert(
                    "No tienes permisos para acceder al panel de administración."
                );

                window.location.href =
                    "index.html";

                return;
            }


            // Usuario autorizado
            console.log(
                "Administrador autorizado:",
                user.email
            );
            
            // Cargar publicaciones pendientes
            await cargarPublicacionesPendientes();
        }
    );

</script>

</body>

</html>
