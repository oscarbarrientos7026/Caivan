async function cargarPublicaciones() {

    const contenedor =
        document.getElementById("mis-publicaciones");

    contenedor.innerHTML = "";


    // Buscar las publicaciones del usuario actual
    const consulta = query(
        collection(db, "publicaciones"),
        where(
            "propietario",
            "==",
            usuarioActual.uid
        )
    );


    // Ejecutar la consulta
    const resultados =
        await getDocs(consulta);


    // Si no hay publicaciones
    if (resultados.empty) {

        contenedor.innerHTML =
            "<p>Aún no tienes publicaciones.</p>";

        return;
    }


    // Recorrer las publicaciones encontradas
    resultados.forEach((documento) => {

        const publicacion =
            documento.data();

        console.log(
            "Imagen de esta publicación:",
            publicacion.imagen
        );
        const idPublicacion =
            documento.id;

        // ==============================
        // TARJETA
        // ==============================

        const tarjeta =
            document.createElement("article");

        tarjeta.classList.add("card");

        tarjeta.addEventListener("click", (evento) => {

            // Si hacemos clic en un botón,
            // no queremos expandir la tarjeta.
            if (evento.target.closest("button")) {
                return;
            }

            tarjeta.classList.toggle("expanded");

        });
        tarjeta.dataset.category =
            publicacion.categoria;


        // ==============================
        // IMAGEN / ICONO
        // ==============================

        const cardImage =
            document.createElement("div");

        cardImage.classList.add("card-image");

        const offerTag =
            document.createElement("span");

        offerTag.classList.add("offer-tag");

        offerTag.textContent =
            "";

        const favorite =
            document.createElement("button");

        favorite.classList.add("favorite");

        favorite.innerHTML =
            '<i class="fa-regular fa-heart"></i>';

        const icono =
            document.createElement("i");

        icono.classList.add("fa-solid");

        icono.classList.add(
            iconosCategoria[publicacion.categoria]
            || "fa-tag"
        );

        cardImage.appendChild(offerTag);
        cardImage.appendChild(favorite);

        // ==============================
        // MOSTRAR IMAGEN O ICONO
        // ==============================

        if (publicacion.imagen) {

            const foto =
                document.createElement("img");

            foto.src =
                publicacion.imagen;

            foto.alt =
                publicacion.titulo;

            cardImage.appendChild(
                foto
            );

        } else {

            cardImage.appendChild(
                icono
            );

        }


        // ==============================
        // CONTENIDO
        // ==============================

        const cardContent =
            document.createElement("div");

        cardContent.classList.add(
            "card-content"
        );


        const categoria =
            document.createElement("div");

        categoria.classList.add(
            "card-category"
        );

        categoria.textContent =
            publicacion.categoria;


        const titulo =
            document.createElement("div");

        titulo.classList.add(
            "card-title"
        );

        titulo.textContent =
            publicacion.titulo;


        const descripcion =
            document.createElement("div");

        descripcion.classList.add(
            "card-description"
        );

        descripcion.textContent =
            publicacion.descripcion;


        // ==============================
        // FOOTER
        // ==============================

        const cardFooter =
            document.createElement("div");
        const botonEditar =
            document.createElement("button");
            botonEditar.textContent ="Editar";
            botonEditar.classList.add("edit-button");
            botonEditar.addEventListener("click",() => {
                    editarPublicacion(
                    idPublicacion,
                    publicacion
                    );
                }
            );
        const botonEliminar =
            document.createElement("button");
        
            botonEliminar.textContent =
            "Eliminar";
        
            botonEliminar.classList.add(
            "delete-button"
            );
            botonEliminar.addEventListener(
            "click",
            async () => {
        
                const confirmar =
                    confirm(
                        "¿Quieres eliminar esta publicación?"
                    );
        
                if (!confirmar) {
                    return;
                }
        
                await eliminarPublicacion(
                    idPublicacion
                );
            }
        );
        cardFooter.classList.add(
            "card-footer"
        );


        const precio =
            document.createElement("div");

        precio.classList.add("price");


        const precioFormateado =
            new Intl.NumberFormat(
                "es-CL"
            ).format(
                publicacion.precio
            );

        precio.textContent =
            "$" + precioFormateado;


        const vendedor =
            document.createElement("div");

        vendedor.classList.add(
            "seller"
        );

        vendedor.textContent =
            usuarioActual.displayName;


        // ==============================
        // CONSTRUIR FOOTER
        // ==============================

        cardFooter.appendChild(precio);
        cardFooter.appendChild(vendedor);
        cardFooter.appendChild(botonEditar);
        cardFooter.appendChild(botonEliminar);

        // ==============================
        // CONSTRUIR CARD-CONTENT
        // ==============================

        cardContent.appendChild(categoria);
        cardContent.appendChild(titulo);
        cardContent.appendChild(descripcion);
        cardContent.appendChild(cardFooter);


        // ==============================
        // CONSTRUIR TARJETA
        // ==============================

        tarjeta.appendChild(cardImage);
        tarjeta.appendChild(cardContent);


        // Añadir tarjeta a la página
        contenedor.appendChild(tarjeta);

    });
}

async function eliminarPublicacion(idPublicacion) {

    try {

        // Localizamos el documento en Firestore
        const referencia =
            doc(
                db,
                "publicaciones",
                idPublicacion
            );


        // Lo eliminamos
        await deleteDoc(referencia);


        // Volvemos a cargar las publicaciones
        // para actualizar la pantalla
        await cargarPublicaciones();


    } catch (error) {

        console.error(
            "Error al eliminar:",
            error
        );

        alert(
            "No se pudo eliminar la publicación."
        );
    }
}

function blobADataURL(blob) {

    return new Promise((resolve, reject) => {

        const lector =
            new FileReader();

        lector.onloadend = () => {

            resolve(
                lector.result
            );

        };

        lector.onerror = () => {

            reject(
                new Error(
                    "No se pudo convertir la imagen."
                )
            );

        };

        lector.readAsDataURL(blob);

    });
}
function reducirImagen(archivo) {

    return new Promise((resolve, reject) => {

        const imagen = new Image();

        const lector = new FileReader();


        lector.onload = (evento) => {

            imagen.onload = () => {

                console.log(
                    "Resolución original:",
                    imagen.width,
                    "x",
                    imagen.height
                );


                // =================================
                // CALCULAR NUEVAS DIMENSIONES
                // =================================

                const anchoOriginal =
                    imagen.width;

                const altoOriginal =
                    imagen.height;

                let nuevoAncho =
                    anchoOriginal;

                let nuevoAlto =
                    altoOriginal;


                // Si el lado mayor supera 720 px
                if (
                    anchoOriginal > 720 ||
                    altoOriginal > 720
                ) {

                    if (
                        anchoOriginal >= altoOriginal
                    ) {

                        // Imagen horizontal
                        nuevoAncho = 720;

                        nuevoAlto =
                            Math.round(
                                altoOriginal *
                                (720 / anchoOriginal)
                            );

                    } else {

                        // Imagen vertical
                        nuevoAlto = 720;

                        nuevoAncho =
                            Math.round(
                                anchoOriginal *
                                (720 / altoOriginal)
                            );

                    }

                }


                console.log(
                    "Nueva resolución:",
                    nuevoAncho,
                    "x",
                    nuevoAlto
                );


                // =================================
                // CREAR CANVAS
                // =================================

                const canvas =
                    document.createElement("canvas");


                canvas.width =
                    nuevoAncho;

                canvas.height =
                    nuevoAlto;


                const contexto =
                    canvas.getContext("2d");


                // Dibujar imagen redimensionada
                contexto.drawImage(
                    imagen,
                    0,
                    0,
                    nuevoAncho,
                    nuevoAlto
                );


                // =================================
                // CONVERTIR A JPEG
                // =================================

                canvas.toBlob(
                    (blob) => {

                        if (!blob) {

                            reject(
                                new Error(
                                    "No se pudo procesar la imagen."
                                )
                            );

                            return;
                        }


                        resolve(blob);

                    },
                    "image/jpeg",
                    0.75
                );

            };


            imagen.onerror = () => {

                reject(
                    new Error(
                        "No se pudo leer la imagen."
                    )
                );

            };


            imagen.src =
                evento.target.result;

        };


        lector.onerror = () => {

            reject(
                new Error(
                    "No se pudo leer el archivo."
                )
            );

        };


        lector.readAsDataURL(archivo);

    });
}

formulario.addEventListener(
    "submit",
    async (event) => {
        console.log("SE EJECUTÓ EL SUBMIT");
        event.preventDefault();


        // ==============================
        // OBTENER DATOS DEL FORMULARIO
        // ==============================
        const archivo =
            document.getElementById("imagen").files[0];

        let imagenBase64 = null;


        if (archivo) {

            const imagenReducida =
                await reducirImagen(archivo);

            imagenBase64 =
                await blobADataURL(
                    imagenReducida
                );

        }

        if (imagenBase64) {

            console.log(
                "Tamaño de imagen:",
                Math.round(
                    imagenBase64.length / 1024
                ),
                "KB"
            );

        }

        const titulo =
            document.getElementById("titulo").value;

        const categoria =
            document.getElementById("categoria").value;

        const precio =
            Number(
                document.getElementById("precio").value
            );

        const descripcion =
            document.getElementById("descripcion").value;


        // Comprobar que haya usuario
        if (!usuarioActual) {

            mensaje.textContent =
                "Debes iniciar sesión.";

            return;
        }


        try {

            // =================================
            // CASO 1: ESTAMOS EDITANDO
            // =================================

            if (publicacionEditando) {

                const referencia =
                    doc(
                        db,
                        "publicaciones",
                        publicacionEditando
                    );


                await updateDoc(
                    referencia,
                    {
                        titulo: titulo,
                        categoria: categoria,
                        precio: precio,
                        descripcion: descripcion
                    }
                );


                mensaje.textContent =
                    "¡Publicación actualizada correctamente!";


                // Ya no estamos editando
                publicacionEditando = null;


                // Restaurar formulario
                formulario.reset();


                // Restaurar botón
                const boton =
                    formulario.querySelector(
                        'button[type="submit"]'
                    );

                boton.textContent =
                    "Publicar";


                // Recargar tarjetas
                await cargarPublicaciones();


                return;
            }


            // =================================
            // CASO 2: NUEVA PUBLICACIÓN
            // =================================
            const referenciaUsuario = doc(db,"usuarios", usuarioActual.uid );

            const resultadoUsuario = await getDoc( referenciaUsuario);

            const perfil = resultadoUsuario.data();

            const docRef =
                await addDoc(
                    collection(
                        db,
                        "publicaciones"
                    ),
                    {
                        titulo: titulo,
                        categoria: categoria,
                        precio: precio,
                        descripcion: descripcion,
                        propietario: usuarioActual.uid,
                        nombreVendedor: perfil.nombre + " " + perfil.apellido,
                        fecha: serverTimestamp(),
                        imagen: imagenBase64,
                        autorizada: false,
                        whatsapp: perfil.whatsapp,
                    }
                );


            console.log(
                "Publicación creada:",
                docRef.id
            );


            mensaje.textContent =
                "¡Publicación creada correctamente!";


            formulario.reset();


            // Recargar las publicaciones
            await cargarPublicaciones();

        }

        catch (error) {

            console.error(
                "Error al guardar:",
                error
            );

            mensaje.textContent =
                "No se pudo guardar la publicación.";
        }

    }
);


        // ==========================================
        // 10. CERRAR SESIÓN
        // ==========================================

        logout.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "login.html";

                }

                catch (error) {

                    console.error(
                        "Error al cerrar sesión:",
                        error
                    );

                }

            }
        );

    </script>
