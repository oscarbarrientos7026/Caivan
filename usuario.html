<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="style.css" rel="stylesheet">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <title>Mi cuenta - Mercado Caivan</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 30px;
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        .publicacion {
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            max-width: 500px;
        }

    </style>

</head>


<body>

    <h1>Mercado Caivan</h1>

    <h2>Mi cuenta</h2>

    <!-- ==========================================
         INFORMACIÓN DEL USUARIO
         ========================================== -->

    <p id="nombre-usuario">Cargando usuario...</p>

    <p id="email-usuario"></p>

    <section id="perfil-container">

    <h2>Completa tu perfil</h2>

    <p>
        Para utilizar Mercado Caivan necesitas
        completar tus datos de contacto.
    </p>

    <form id="perfil-formulario">

        <label for="nombre">
            Nombre
        </label>

        <input
            type="text"
            id="nombre"
            required
        >


        <label for="apellido">
            Apellido
        </label>

        <input
            type="text"
            id="apellido"
            required
        >


        <label for="whatsapp">
            WhatsApp
        </label>

        <div>
            <span>+569</span>

            <input
                type="tel"
                id="whatsapp"
                placeholder="12345678"
                maxlength="8"
                pattern="[0-9]{8}"
                required
            >
        </div>


        <button type="submit">
            Guardar datos
        </button>

        <p id="mensaje-perfil"></p>

    </form>

 </section>
    <!-- ==========================================
         FORMULARIO DE PUBLICACIÓN
         ========================================== -->

    <h2>Nueva publicación</h2>

    <section id="form-publicacion" style="display: none;">

        <label>
            Título
        </label>

        <input
            type="text"
            id="titulo"
            placeholder="Ej: Monitor Samsung 24 pulgadas"
            required
        >


        <label>
            Categoría
        </label>

        <select id="categoria" required>

            <option value="">
                Selecciona una categoría
            </option>

            <option value="hogar">
                Hogar
            </option>

            <option value="ropa">
                Ropa
            </option>

            <option value="tecnologia">
                Tecnología
            </option>

            <option value="deportes">
                Deportes
            </option>

            <option value="comida">
                Comida
            </option>

            <option value="tiendas">
                Tiendas
            </option>

            <option value="arriendos">
                Arriendos
            </option>

            <option value="reparaciones">
                Reparaciones
            </option>

            <option value="transporte">
                Transporte
            </option>

            <option value="mascotas">
                Mascotas
            </option>

        </select>


        <label>
            Precio
        </label>

        <input
            type="number"
            id="precio"
            placeholder="80000"
            min="0"
            required
        >


        <label>
            Descripción
        </label>

        <textarea
            id="descripcion"
            placeholder="Describe tu producto..."
            required
        ></textarea>


        <button type="submit">
            Publicar
        </button>

    </form>


    <!-- ==========================================
         MENSAJE DE ESTADO
         ========================================== -->

    <p id="mensaje"></p>


    <!-- ==========================================
         MIS PUBLICACIONES
         ========================================== -->

    <h2>Mis publicaciones</h2>

    <div id="mis-publicaciones"></div>


    <br>

    <button id="logout">
        Cerrar sesión
    </button>


    <!-- ==========================================
         FIREBASE
         ========================================== -->

    <script type="module">

        // ==========================================
        // 1. IMPORTAMOS FIREBASE
        // ==========================================

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        // Firestore
        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp,
            query,
            where,
            getDocs,
            deleteDoc,
            doc,
            updateDoc,
            getDoc,
            setDoc,
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


        // ==========================================
        // 2. CONFIGURACIÓN DE FIREBASE
        // ==========================================

        const firebaseConfig = {

              apiKey: "AIzaSyA9nKwRTGJliMO0Fk3rXiPk6rEAbQATiwA",
              authDomain: "mercado-caivan.firebaseapp.com",
              projectId: "mercado-caivan",
              storageBucket: "mercado-caivan.firebasestorage.app",
              messagingSenderId: "193052002924",
              appId: "1:193052002924:web:228d68afbd8601dd7e2649",
              measurementId: "G-WVWSJ9MD6Q"

        };


        // ==========================================
        // 3. INICIALIZAMOS FIREBASE
        // ==========================================

        const app = initializeApp(firebaseConfig);


        // ==========================================
        // 4. AUTENTICACIÓN
        // ==========================================

        const auth = getAuth(app);


        // ==========================================
        // 5. FIRESTORE
        // ==========================================

        const db = getFirestore(app);


        // ==========================================
        // 6. ELEMENTOS HTML
        // ==========================================

        const nombreUsuario =
            document.getElementById("nombre-usuario");

        const emailUsuario =
            document.getElementById("email-usuario");

        const perfilFormulario = document.getElementById( "perfil-formulario");

perfilFormulario.addEventListener(
    "submit",
    async (event) => {
        event.preventDefault();

        const nombre =
            document.getElementById( "nombre" ).value.trim();


        const apellido =
            document.getElementById( "apellido").value.trim();


        const whatsapp =
            document.getElementById( "whatsapp" ).value.trim();


        const mensajePerfil =
            document.getElementById( "mensaje-perfil" );


        // Comprobar formato del teléfono
        if (!/^[0-9]{8}$/.test(whatsapp)) {
            mensajePerfil.textContent ="Ingresa un número móvil chileno de 8 dígitos.";
            return;
        }


        try {
            await setDoc(
                doc(db,
                    "usuarios",
                    usuarioActual.uid
                ),
                { nombre: nombre,
                    apellido: apellido,
                    whatsapp: whatsapp
                }
            );


            mensajePerfil.textContent =
                "Datos guardados correctamente.";

            mostrarPerfilCompleto({
                nombre: nombre,
                apellido: apellido,
                whatsapp: whatsapp
            });
        await cargarPublicaciones();

        } catch (error) {

            console.error( "Error al guardar perfil:",error);

            mensajePerfil.textContent ="No se pudieron guardar los datos.";
        }
    }
);

        const mensaje =
            document.getElementById("mensaje");

        const logout =
            document.getElementById("logout");

        // Icono que corresponde a cada categoría
                    const iconosCategoria = {
            
                hogar: "fa-chair",
            
                ropa: "fa-shirt",
            
                tecnologia: "fa-laptop",
            
                deportes: "fa-futbol",
            
                comida: "fa-utensils",
            
                tiendas: "fa-store",
            
                arriendos: "fa-house",
            
                reparaciones: "fa-wrench",
            
                transporte: "fa-car",
            
                mascotas: "fa-dog"
            };

// ==========================================
// 7. USUARIO ACTUAL
 // ==========================================

        let usuarioActual = null;
        let publicacionEditando = null;

                                                        // FUNCIONES

async function comprobarPerfil() {

    const referencia =
        doc(db,"usuarios", usuarioActual.uid );

    const resultado = await getDoc(referencia);


    // =================================
    // EL PERFIL EXISTE
    // =================================

    if (resultado.exists()) {

        mostrarPerfilCompleto( resultado.data());

        // Ahora sí puede utilizar
        // sus publicaciones
        await cargarPublicaciones();
        return;
    }


    // =================================
    // PERFIL NO EXISTE
    // =================================

    mostrarFormularioPerfil();
}
        
function mostrarFormularioPerfil() {
    document.getElementById("perfil-container").style.display = "block";
}

function mostrarPerfilCompleto(perfil) {

    // Ocultamos el formulario de completar perfil
    document.getElementById(
        "perfil-container"
    ).style.display = "none";

    // Mostramos el formulario de publicaciones
    document.getElementById(
        "form-publicacion"
    ).style.display = "block";
}


// ==========================================
// MOSTRAR MIS PUBLICACIONES
// ==========================================

async function cargarPublicaciones() {

    const contenedor =
        document.getElementById("mis-publicaciones");

    contenedor.innerHTML = "";


    // Buscar las publicaciones del usuario actual
    const consulta = query(
        collection(db, "publicaciones"),
        where(
            "propietario",
            "==",
            usuarioActual.uid
        )
    );


    // Ejecutar la consulta
    const resultados =
        await getDocs(consulta);


    // Si no hay publicaciones
    if (resultados.empty) {

        contenedor.innerHTML =
            "<p>Aún no tienes publicaciones.</p>";

        return;
    }


    // Recorrer las publicaciones encontradas
    resultados.forEach((documento) => {

        const publicacion =
            documento.data();
        const idPublicacion =
            documento.id;

        // ==============================
        // TARJETA
        // ==============================

        const tarjeta =
            document.createElement("article");

        tarjeta.classList.add("card");

        tarjeta.dataset.category =
            publicacion.categoria;


        // ==============================
        // IMAGEN / ICONO
        // ==============================

        const cardImage =
            document.createElement("div");

        cardImage.classList.add("card-image");


        const offerTag =
            document.createElement("span");

        offerTag.classList.add("offer-tag");

        offerTag.textContent =
            "Oferta";


        const favorite =
            document.createElement("button");

        favorite.classList.add("favorite");

        favorite.innerHTML =
            '<i class="fa-regular fa-heart"></i>';


        const icono =
            document.createElement("i");

        icono.classList.add("fa-solid");

        icono.classList.add(
            iconosCategoria[publicacion.categoria]
            || "fa-tag"
        );


        cardImage.appendChild(offerTag);
        cardImage.appendChild(favorite);
        cardImage.appendChild(icono);


        // ==============================
        // CONTENIDO
        // ==============================

        const cardContent =
            document.createElement("div");

        cardContent.classList.add(
            "card-content"
        );


        const categoria =
            document.createElement("div");

        categoria.classList.add(
            "card-category"
        );

        categoria.textContent =
            publicacion.categoria;


        const titulo =
            document.createElement("div");

        titulo.classList.add(
            "card-title"
        );

        titulo.textContent =
            publicacion.titulo;


        const descripcion =
            document.createElement("div");

        descripcion.classList.add(
            "card-description"
        );

        descripcion.textContent =
            publicacion.descripcion;


        // ==============================
        // FOOTER
        // ==============================

        const cardFooter =
            document.createElement("div");
        const botonEditar =
            document.createElement("button");
            botonEditar.textContent ="Editar";
            botonEditar.classList.add("edit-button");
            botonEditar.addEventListener("click",() => {
                    editarPublicacion(
                    idPublicacion,
                    publicacion
                    );
                }
            );
        const botonEliminar =
            document.createElement("button");
        
            botonEliminar.textContent =
            "Eliminar";
        
            botonEliminar.classList.add(
            "delete-button"
            );
            botonEliminar.addEventListener(
            "click",
            async () => {
        
                const confirmar =
                    confirm(
                        "¿Quieres eliminar esta publicación?"
                    );
        
                if (!confirmar) {
                    return;
                }
        
                await eliminarPublicacion(
                    idPublicacion
                );
            }
        );
        cardFooter.classList.add(
            "card-footer"
        );


        const precio =
            document.createElement("div");

        precio.classList.add("price");


        const precioFormateado =
            new Intl.NumberFormat(
                "es-CL"
            ).format(
                publicacion.precio
            );

        precio.textContent =
            "$" + precioFormateado;


        const vendedor =
            document.createElement("div");

        vendedor.classList.add(
            "seller"
        );

        vendedor.textContent =
            usuarioActual.displayName;


        // ==============================
        // CONSTRUIR FOOTER
        // ==============================

        cardFooter.appendChild(precio);
        cardFooter.appendChild(vendedor);
        cardFooter.appendChild(botonEditar);
        cardFooter.appendChild(botonEliminar);

        // ==============================
        // CONSTRUIR CARD-CONTENT
        // ==============================

        cardContent.appendChild(categoria);
        cardContent.appendChild(titulo);
        cardContent.appendChild(descripcion);
        cardContent.appendChild(cardFooter);


        // ==============================
        // CONSTRUIR TARJETA
        // ==============================

        tarjeta.appendChild(cardImage);
        tarjeta.appendChild(cardContent);


        // Añadir tarjeta a la página
        contenedor.appendChild(tarjeta);

    });
}

async function eliminarPublicacion(idPublicacion) {

    try {

        // Localizamos el documento en Firestore
        const referencia =
            doc(
                db,
                "publicaciones",
                idPublicacion
            );


        // Lo eliminamos
        await deleteDoc(referencia);


        // Volvemos a cargar las publicaciones
        // para actualizar la pantalla
        await cargarPublicaciones();


    } catch (error) {

        console.error(
            "Error al eliminar:",
            error
        );

        alert(
            "No se pudo eliminar la publicación."
        );
    }
}

function editarPublicacion(idPublicacion, publicacion) {

    // Guardamos qué documento estamos editando
    publicacionEditando =
        idPublicacion;


    // Colocamos los datos de la publicación
    // dentro del formulario

    document.getElementById("titulo").value =
        publicacion.titulo;

    document.getElementById("categoria").value =
        publicacion.categoria;

    document.getElementById("precio").value =
        publicacion.precio;

    document.getElementById("descripcion").value =
        publicacion.descripcion;


    // Cambiamos el texto del botón
    const boton =
        document.querySelector(
            '#form-publicacion button[type="submit"]'
        );

    if (boton) {
        boton.textContent =
            "Guardar cambios";
    }


    // Mensaje para indicar que estamos editando
    const mensaje =
        document.getElementById("mensaje");

    mensaje.textContent =
        "Editando publicación...";


    // Llevamos al usuario hacia el formulario
    document
        .getElementById("titulo")
        .scrollIntoView({
            behavior: "smooth"
        });
}
        // ==========================================
        // 8. COMPROBAR AUTENTICACIÓN
        // ==========================================

   onAuthStateChanged(
    auth, async (user) => {

        // =================================
        // NO HAY USUARIO AUTENTICADO
        // =================================

        if (!user) {
          window.location.href =  "login.html";

            return;
        }


        // =================================
        // USUARIO AUTENTICADO
        // =================================

        usuarioActual = user;

        // Mostrar información de Google
        document.getElementById( "nombre-usuario" ).textContent =user.displayName || "Usuario";

        document.getElementById(  "email-usuario" ).textContent =user.email;


        // =================================
        // COMPROBAR PERFIL
        // =================================
        await comprobarPerfil();
    }
);

const formulario =document.getElementById("form-publicacion");
        // ==========================================
        // 9. CREAR PUBLICACIÓN
        // ==========================================

formulario.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        // ==============================
        // OBTENER DATOS DEL FORMULARIO
        // ==============================

        const titulo =
            document.getElementById("titulo").value;

        const categoria =
            document.getElementById("categoria").value;

        const precio =
            Number(
                document.getElementById("precio").value
            );

        const descripcion =
            document.getElementById("descripcion").value;


        // Comprobar que haya usuario
        if (!usuarioActual) {

            mensaje.textContent =
                "Debes iniciar sesión.";

            return;
        }


        try {

            // =================================
            // CASO 1: ESTAMOS EDITANDO
            // =================================

            if (publicacionEditando) {

                const referencia =
                    doc(
                        db,
                        "publicaciones",
                        publicacionEditando
                    );


                await updateDoc(
                    referencia,
                    {
                        titulo: titulo,
                        categoria: categoria,
                        precio: precio,
                        descripcion: descripcion
                    }
                );


                mensaje.textContent =
                    "¡Publicación actualizada correctamente!";


                // Ya no estamos editando
                publicacionEditando = null;


                // Restaurar formulario
                formulario.reset();


                // Restaurar botón
                const boton =
                    formulario.querySelector(
                        'button[type="submit"]'
                    );

                boton.textContent =
                    "Publicar";


                // Recargar tarjetas
                await cargarPublicaciones();


                return;
            }


            // =================================
            // CASO 2: NUEVA PUBLICACIÓN
            // =================================

            const docRef =
                await addDoc(
                    collection(
                        db,
                        "publicaciones"
                    ),
                    {
                        titulo: titulo,
                        categoria: categoria,
                        precio: precio,
                        descripcion: descripcion,
                        propietario:
                            usuarioActual.uid,
                        fecha:
                            serverTimestamp()
                    }
                );


            console.log(
                "Publicación creada:",
                docRef.id
            );


            mensaje.textContent =
                "¡Publicación creada correctamente!";


            formulario.reset();


            // Recargar las publicaciones
            await cargarPublicaciones();

        }

        catch (error) {

            console.error(
                "Error al guardar:",
                error
            );

            mensaje.textContent =
                "No se pudo guardar la publicación.";
        }

    }
);


        // ==========================================
        // 10. CERRAR SESIÓN
        // ==========================================

        logout.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "login.html";

                }

                catch (error) {

                    console.error(
                        "Error al cerrar sesión:",
                        error
                    );

                }

            }
        );

    </script>

</body>

</html>
