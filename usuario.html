<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cuenta - Mercado Caivan</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 30px;
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        .publicacion {
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            max-width: 500px;
        }

    </style>

</head>


<body>

    <h1>Mercado Caivan</h1>

    <h2>Mi cuenta</h2>

    <!-- ==========================================
         INFORMACIÓN DEL USUARIO
         ========================================== -->

    <p id="nombre-usuario">Cargando usuario...</p>

    <p id="email-usuario"></p>


    <!-- ==========================================
         FORMULARIO DE PUBLICACIÓN
         ========================================== -->

    <h2>Nueva publicación</h2>

    <form id="form-publicacion">

        <label>
            Título
        </label>

        <input
            type="text"
            id="titulo"
            placeholder="Ej: Monitor Samsung 24 pulgadas"
            required
        >


        <label>
            Categoría
        </label>

        <select id="categoria" required>

            <option value="">
                Selecciona una categoría
            </option>

            <option value="hogar">
                Hogar
            </option>

            <option value="ropa">
                Ropa
            </option>

            <option value="tecnologia">
                Tecnología
            </option>

            <option value="deportes">
                Deportes
            </option>

            <option value="comida">
                Comida
            </option>

            <option value="tiendas">
                Tiendas
            </option>

            <option value="arriendos">
                Arriendos
            </option>

            <option value="reparaciones">
                Reparaciones
            </option>

            <option value="transporte">
                Transporte
            </option>

            <option value="mascotas">
                Mascotas
            </option>

        </select>


        <label>
            Precio
        </label>

        <input
            type="number"
            id="precio"
            placeholder="80000"
            min="0"
            required
        >


        <label>
            Descripción
        </label>

        <textarea
            id="descripcion"
            placeholder="Describe tu producto..."
            required
        ></textarea>


        <button type="submit">
            Publicar
        </button>

    </form>


    <!-- ==========================================
         MENSAJE DE ESTADO
         ========================================== -->

    <p id="mensaje"></p>


    <!-- ==========================================
         MIS PUBLICACIONES
         ========================================== -->

    <h2>Mis publicaciones</h2>

    <div id="mis-publicaciones"></div>


    <br>

    <button id="logout">
        Cerrar sesión
    </button>


    <!-- ==========================================
         FIREBASE
         ========================================== -->

    <script type="module">

        // ==========================================
        // 1. IMPORTAMOS FIREBASE
        // ==========================================

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        // Firestore
        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp,
            query,
            where,
            getDocs,
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


        // ==========================================
        // 2. CONFIGURACIÓN DE FIREBASE
        // ==========================================

        const firebaseConfig = {

              apiKey: "AIzaSyA9nKwRTGJliMO0Fk3rXiPk6rEAbQATiwA",
              authDomain: "mercado-caivan.firebaseapp.com",
              projectId: "mercado-caivan",
              storageBucket: "mercado-caivan.firebasestorage.app",
              messagingSenderId: "193052002924",
              appId: "1:193052002924:web:228d68afbd8601dd7e2649",
              measurementId: "G-WVWSJ9MD6Q"

        };


        // ==========================================
        // 3. INICIALIZAMOS FIREBASE
        // ==========================================

        const app = initializeApp(firebaseConfig);


        // ==========================================
        // 4. AUTENTICACIÓN
        // ==========================================

        const auth = getAuth(app);


        // ==========================================
        // 5. FIRESTORE
        // ==========================================

        const db = getFirestore(app);


        // ==========================================
        // 6. ELEMENTOS HTML
        // ==========================================

        const nombreUsuario =
            document.getElementById("nombre-usuario");

        const emailUsuario =
            document.getElementById("email-usuario");

        const formulario =
            document.getElementById("form-publicacion");

        const mensaje =
            document.getElementById("mensaje");

        const logout =
            document.getElementById("logout");


        // ==========================================
        // 7. USUARIO ACTUAL
        // ==========================================

        let usuarioActual = null;
        // Icono que corresponde a cada categoría
            const iconosCategoria = {
            
                hogar: "fa-chair",
            
                ropa: "fa-shirt",
            
                tecnologia: "fa-laptop",
            
                deportes: "fa-futbol",
            
                comida: "fa-utensils",
            
                tiendas: "fa-store",
            
                arriendos: "fa-house",
            
                reparaciones: "fa-wrench",
            
                transporte: "fa-car",
            
                mascotas: "fa-dog"
            };
// ==========================================
// MOSTRAR MIS PUBLICACIONES
// ==========================================

async function cargarPublicaciones() {

    const contenedor =
        document.getElementById("mis-publicaciones");

    contenedor.innerHTML = "";


    // Buscar las publicaciones del usuario actual
    const consulta = query(
        collection(db, "publicaciones"),
        where(
            "propietario",
            "==",
            usuarioActual.uid
        )
    );


    // Ejecutar la consulta
    const resultados =
        await getDocs(consulta);


    // Si no hay publicaciones
    if (resultados.empty) {

        contenedor.innerHTML =
            "<p>Aún no tienes publicaciones.</p>";

        return;
    }


    // Recorrer las publicaciones encontradas
    resultados.forEach((documento) => {

        const publicacion =
            documento.data();


        // ==============================
        // TARJETA
        // ==============================

        const tarjeta =
            document.createElement("article");

        tarjeta.classList.add("card");

        tarjeta.dataset.category =
            publicacion.categoria;


        // ==============================
        // IMAGEN / ICONO
        // ==============================

        const cardImage =
            document.createElement("div");

        cardImage.classList.add("card-image");


        const offerTag =
            document.createElement("span");

        offerTag.classList.add("offer-tag");

        offerTag.textContent =
            "Oferta";


        const favorite =
            document.createElement("button");

        favorite.classList.add("favorite");

        favorite.innerHTML =
            '<i class="fa-regular fa-heart"></i>';


        const icono =
            document.createElement("i");

        icono.classList.add("fa-solid");

        icono.classList.add(
            iconosCategoria[publicacion.categoria]
            || "fa-tag"
        );


        cardImage.appendChild(offerTag);
        cardImage.appendChild(favorite);
        cardImage.appendChild(icono);


        // ==============================
        // CONTENIDO
        // ==============================

        const cardContent =
            document.createElement("div");

        cardContent.classList.add(
            "card-content"
        );


        const categoria =
            document.createElement("div");

        categoria.classList.add(
            "card-category"
        );

        categoria.textContent =
            publicacion.categoria;


        const titulo =
            document.createElement("div");

        titulo.classList.add(
            "card-title"
        );

        titulo.textContent =
            publicacion.titulo;


        const descripcion =
            document.createElement("div");

        descripcion.classList.add(
            "card-description"
        );

        descripcion.textContent =
            publicacion.descripcion;


        // ==============================
        // FOOTER
        // ==============================

        const cardFooter =
            document.createElement("div");

        cardFooter.classList.add(
            "card-footer"
        );


        const precio =
            document.createElement("div");

        precio.classList.add("price");


        const precioFormateado =
            new Intl.NumberFormat(
                "es-CL"
            ).format(
                publicacion.precio
            );

        precio.textContent =
            "$" + precioFormateado;


        const vendedor =
            document.createElement("div");

        vendedor.classList.add(
            "seller"
        );

        vendedor.textContent =
            usuarioActual.displayName;


        // ==============================
        // CONSTRUIR FOOTER
        // ==============================

        cardFooter.appendChild(precio);
        cardFooter.appendChild(vendedor);


        // ==============================
        // CONSTRUIR CARD-CONTENT
        // ==============================

        cardContent.appendChild(categoria);
        cardContent.appendChild(titulo);
        cardContent.appendChild(descripcion);
        cardContent.appendChild(cardFooter);


        // ==============================
        // CONSTRUIR TARJETA
        // ==============================

        tarjeta.appendChild(cardImage);
        tarjeta.appendChild(cardContent);


        // Añadir tarjeta a la página
        contenedor.appendChild(tarjeta);

    });
}


    // Si no existen publicaciones
    if (resultados.empty) {

        contenedor.innerHTML =
            "<p>Aún no tienes publicaciones.</p>";
    }
}


    // ==========================================
    // SI NO HAY PUBLICACIONES
    // ==========================================

    if (resultados.empty) {

        contenedor.innerHTML =
            "<p>Aún no tienes publicaciones.</p>";

    }



        // ==========================================
        // 8. COMPROBAR AUTENTICACIÓN
        // ==========================================

        onAuthStateChanged(auth, (user) => {

if (user) {

    console.log(
        "Usuario autenticado:",
        user
    );
    usuarioActual = user;

    // Mostrar nombre
    nombreUsuario.textContent =
        "Bienvenido, " + user.displayName;

    // Mostrar email
    emailUsuario.textContent =
        user.email;

    // Cargar publicaciones del usuario
    cargarPublicaciones();
}
            else {

                // Si no está conectado,
                // volver al login.
                window.location.href =
                    "login.html";

            }
        });


        // ==========================================
        // 9. CREAR PUBLICACIÓN
        // ==========================================

        formulario.addEventListener(
            "submit",
            async (event) => {

                // Evita que el formulario
                // recargue la página.

                event.preventDefault();


                // ==================================
                // OBTENER LOS DATOS DEL FORMULARIO
                // ==================================

                const titulo =
                    document.getElementById("titulo").value;

                const categoria =
                    document.getElementById("categoria").value;

                const precio =
                    Number(
                        document.getElementById("precio").value
                    );

                const descripcion =
                    document.getElementById("descripcion").value;


                // ==================================
                // COMPROBAR USUARIO
                // ==================================

                if (!usuarioActual) {

                    mensaje.textContent =
                        "Debes iniciar sesión.";

                    return;
                }


                try {

                    // ==================================
                    // GUARDAR EN FIRESTORE
                    // ==================================

                    const docRef = await addDoc(
                        collection(db, "publicaciones"),
                        {

                            titulo: titulo,

                            categoria: categoria,

                            precio: precio,

                            descripcion: descripcion,

                            // UID del propietario

                            propietario:
                                usuarioActual.uid,

                            // Fecha de creación

                            fecha:
                                serverTimestamp()
                        }
                    );


                    console.log(
                        "Publicación creada:",
                        docRef.id
                    );


                    mensaje.textContent =
                        "¡Publicación creada correctamente!";


                    // Limpiamos el formulario

                    formulario.reset();

                }

                catch (error) {

                    console.error(
                        "Error al crear publicación:",
                        error
                    );

                    mensaje.textContent =
                        "No se pudo crear la publicación.";

                }

            }
        );


        // ==========================================
        // 10. CERRAR SESIÓN
        // ==========================================

        logout.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "login.html";

                }

                catch (error) {

                    console.error(
                        "Error al cerrar sesión:",
                        error
                    );

                }

            }
        );

    </script>

</body>

</html>
