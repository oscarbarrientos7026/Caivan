<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cuenta - Mercado Caivan</title>
</head>

<body>

    <h1>Mercado Caivan</h1>

    <h2>Mi cuenta</h2>

    <!-- Aquí mostraremos los datos del usuario -->
    <p id="nombre-usuario">Cargando usuario...</p>

    <p id="email-usuario"></p>

    <!-- Botón para cerrar sesión -->
    <button id="logout">
        Cerrar sesión
    </button>


    <script type="module">

        // ==========================================
        // 1. IMPORTAMOS FIREBASE
        // ==========================================

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        // ==========================================
        // 2. CONFIGURACIÓN DE FIREBASE
        // ==========================================

        const firebaseConfig = {

              apiKey: "AIzaSyA9nKwRTGJliMO0Fk3rXiPk6rEAbQATiwA",
              authDomain: "mercado-caivan.firebaseapp.com",
              projectId: "mercado-caivan",
              storageBucket: "mercado-caivan.firebasestorage.app",
              messagingSenderId: "193052002924",
              appId: "1:193052002924:web:228d68afbd8601dd7e2649",
              measurementId: "G-WVWSJ9MD6Q"

        };


        // ==========================================
        // 3. INICIALIZAMOS FIREBASE
        // ==========================================

        const app = initializeApp(firebaseConfig);


        // ==========================================
        // 4. INICIALIZAMOS AUTHENTICATION
        // ==========================================

        const auth = getAuth(app);


        // ==========================================
        // 5. BUSCAMOS LOS ELEMENTOS HTML
        // ==========================================

        const nombreUsuario =
            document.getElementById("nombre-usuario");

        const emailUsuario =
            document.getElementById("email-usuario");

        const logout =
            document.getElementById("logout");


        // ==========================================
        // 6. COMPROBAMOS EL ESTADO DE AUTENTICACIÓN
        // ==========================================

        onAuthStateChanged(auth, (user) => {

            // --------------------------------------
            // Si existe un usuario...
            // --------------------------------------

            if (user) {

                console.log("Usuario autenticado:", user);

                // Mostramos su nombre
                nombreUsuario.textContent =
                    "Bienvenido, " + user.displayName;

                // Mostramos su correo
                emailUsuario.textContent =
                    user.email;

            }

            // --------------------------------------
            // Si NO existe un usuario...
            // --------------------------------------

            else {

                console.log("No hay usuario autenticado");

                // Lo enviamos nuevamente al login
                window.location.href = "login.html";

            }

        });


        // ==========================================
        // 7. CERRAR SESIÓN
        // ==========================================

        logout.addEventListener("click", async () => {

            try {

                await signOut(auth);

                // Después de cerrar sesión,
                // volvemos al login

                window.location.href = "login.html";

            }

            catch (error) {

                console.error(
                    "Error al cerrar sesión:",
                    error
                );

            }

        });

    </script>

</body>

</html>
