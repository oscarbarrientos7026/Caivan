    <script type="module">

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
        getFirestore,
        collection,
        query,
        where,
        getDocs
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    const firebaseConfig = {
              apiKey: "AIzaSyA9nKwRTGJliMO0Fk3rXiPk6rEAbQATiwA",
              authDomain: "mercado-caivan.firebaseapp.com",
              projectId: "mercado-caivan",
              storageBucket: "mercado-caivan.firebasestorage.app",
              messagingSenderId: "193052002924",
              appId: "1:193052002924:web:228d68afbd8601dd7e2649",
              measurementId: "G-WVWSJ9MD6Q"

    };


    const app =
        initializeApp(
            firebaseConfig
        );


    const db =
        getFirestore(app);


    async function cargarPublicacionesAutorizadas() {

        const consulta =
            query(
                collection(
                    db,
                    "publicaciones"
                ),

                where(
                    "autorizada",
                    "==",
                    true
                )
            );


        const resultados =
            await getDocs(
                consulta
            );


        resultados.forEach((documento) => {

            const publicacion = documento.data();

            // ==============================
            // TARJETA
            // ==============================

            const tarjeta = document.createElement("article");
            tarjeta.classList.add("card");
            tarjeta.dataset.category = publicacion.categoria;
            tarjeta.addEventListener("click", (evento) => {

                if (evento.target.closest("button")) {
                    return;
                }

                const tarjetaClon = tarjeta.cloneNode(true);

                detalleContenido.innerHTML = "";

                detalleContenido.appendChild(tarjetaClon);

                modalDetalle.style.display = "flex";
            });

            // ==============================
            // IMAGEN
            // ==============================

            const cardImage = document.createElement("div");
            cardImage.classList.add("card-image");

            if (publicacion.imagen) {

                const foto = document.createElement("img");

                foto.src = publicacion.imagen;
                foto.alt = publicacion.titulo;

                cardImage.appendChild(foto);
            }


            // ==============================
            // CONTENIDO
            // ==============================

            const cardContent = document.createElement("div");
            cardContent.classList.add("card-content");


            // Categoría

            const cardCategory = document.createElement("div");
            cardCategory.classList.add("card-category");
            cardCategory.textContent = publicacion.categoria;


            // Título

            const cardTitle = document.createElement("div");
            cardTitle.classList.add("card-title");
            cardTitle.textContent = publicacion.titulo;


            // Descripción

            const cardDescription = document.createElement("div");
            cardDescription.classList.add("card-description");
            cardDescription.textContent = publicacion.descripcion;


            // ==============================
            // FOOTER
            // ==============================

            const cardFooter = document.createElement("div");
            cardFooter.classList.add("card-footer");


            // Precio

            const price = document.createElement("div");
            price.classList.add("price");
            price.textContent = publicacion.precio;


            // Propietario

            const seller = document.createElement("div");
            seller.classList.add("seller");
            seller.textContent = publicacion.nombreVendedor;

            // Boton

            const botonWhatsapp = document.createElement("a");

            botonWhatsapp.classList.add("boton-whatsapp");
            botonWhatsapp.href ="https://wa.me/569" + publicacion.whatsapp;

            botonWhatsapp.target = "_blank";

            botonWhatsapp.innerHTML ='<i class="fa-brands fa-whatsapp"></i> Contactar';

            // ==============================
            // CONSTRUCCIÓN
            // ==============================

            cardFooter.appendChild(price);
            cardFooter.appendChild(seller);
            cardFooter.appendChild(botonWhatsapp);

            cardContent.appendChild(cardCategory);
            cardContent.appendChild(cardTitle);
            cardContent.appendChild(cardDescription);
            cardContent.appendChild(cardFooter);

            tarjeta.appendChild(cardImage);
            tarjeta.appendChild(cardContent);


            // ==============================
            // INSERTAR EN LA PÁGINA
            // ==============================

            const contenedor = document.getElementById("contenedor-publicaciones");

            contenedor.appendChild(tarjeta);

        });

    }


    cargarPublicacionesAutorizadas();

</script>

<div id="modal-detalle" class="modal-detalle">

    <!-- ==============================
     MODAL DETALLE PUBLICACIÓN
============================== -->

    <script>
    // ============================== // ELEMENTOS DEL MODAL // ============================== 
    const modalDetalle = 
    document.getElementById( "modal-detalle" );

    const detalleContenido = 
    document.getElementById( "detalle-contenido" );

    const cerrarDetalle = 
    document.getElementById( "cerrar-detalle" );

    // ==============================
    // ABRIR DETALLE
    // ==============================

    document.addEventListener(
        "click",
        (evento) => {

            const card =
                evento.target.closest(".card");


            if (!card) {
                return;
            }


            if (
                evento.target.closest("button")
            ) {
                return;
            }


            const tarjetaClon =
                card.cloneNode(true);


            detalleContenido.innerHTML =
                "";


            detalleContenido.appendChild(
                tarjetaClon
            );


            modalDetalle.style.display =
                "flex";

        }
    );

    // ==============================
    // CERRAR CON X
    // ==============================

    cerrarDetalle.addEventListener(
        "click",
        () => {

            modalDetalle.style.display =
                "none";

            detalleContenido.innerHTML =
                "";

        }
    );


    // ==============================
    // CERRAR HACIENDO CLIC AFUERA
    // ==============================

    modalDetalle.addEventListener(
        "click",
        (evento) => {

            if (
                evento.target === modalDetalle
            ) {

                modalDetalle.style.display =
                    "none";

                detalleContenido.innerHTML =
                    "";

            }

        }
    );

    </script>
